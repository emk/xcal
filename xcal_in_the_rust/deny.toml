# Project policies.
#
# These policies can be enforced using `cargo deny check`.

[advisories]
ignore = []

[licenses]
# Allow common OSI-approved, non-copyleft licenses.
allow = [
    "0BSD",
    "Apache-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[licenses.private]
# This crate is unpublished/unreleased, so ignore license requirements for it.
ignore = true

[bans]
deny = [
    # OpenSSL has caused endless deployment and build problems. We use rustls
    # for TLS everywhere.
    { name = "openssl" },
    { name = "openssl-sys" },
]

# Ignore duplicate versions of these crates (pulled in by different dependencies).
skip = [
    { crate = "rustc-hash@1", reason = "fluent-bundle pulls v1, intl-memoizer pulls v2" },
    { crate = "unicode-width@0.1", reason = "miette pulls v0.1 via textwrap" },
    { crate = "windows-sys@0.60", reason = "tokio/socket2 lag behind other deps" },
]
